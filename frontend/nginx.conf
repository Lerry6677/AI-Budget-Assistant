# ============================================================================
# 生产 nginx 站点配置（阶段 3-3）
# ----------------------------------------------------------------------------
# - SPA：/ 静态托管 + history 路由 fallback 到 index.html
# - API：/api/xxx -> backend:8000/xxx（proxy_pass 尾斜杠剥离 /api 前缀，
#   FastAPI 21 条路由零修改）
# - ACME：/.well-known/acme-challenge/ 走 certbot webroot（阶段 3-7 HTTPS）
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    # Let's Encrypt HTTP-01 挑战（阶段 3-7 由宿主机 certbot --webroot 签发）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 同域反代：前端产物中 API base 为 /api（build-time 烤入）
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent 走真实 LLM，响应可达分钟级，读超时放宽
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }

    # SPA history 路由 fallback（/stats /expenses /profile 直接刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
