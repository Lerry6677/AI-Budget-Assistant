# ============================================================================
# 生产服务器编排（阶段 3-3）
# ----------------------------------------------------------------------------
# 与开发用 docker-compose.yml 并存互不影响：
#   - 开发 compose：backend 单容器 + 宿主机原生 MySQL（host.docker.internal）
#   - 本文件：nginx + backend + mysql:8.0 三容器，同机内部网络，干净开局
#
# 服务器部署（3-6 执行）：
#   1. git clone 后在服务器独立创建 .env（参考 .env.example「生产服务器」段；
#      MYSQL_ROOT_PASSWORD / JWT_SECRET_KEY 必须全新生成，不得复用开发机值）
#   2. mkdir -p data nginx-certbot/www
#   3. docker compose -f docker-compose.server.yml up -d --build
#
# 本地验证（不动开发环境）：
#   $env:MYSQL_ROOT_PASSWORD='<临时值>'; $env:HTTP_PORT='18080'
#   docker compose -p ai-budget-server -f docker-compose.server.yml up -d --build
# ============================================================================
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # :? 守卫——未设置时 compose 直接报错，避免空密码起库
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      # 首次启动自动建空库 ai_budget；7 张表由 backend startup create_all 创建（干净开局，零手工 SQL）
      MYSQL_DATABASE: ai_budget
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # $$ 转义：compose 插值后容器内 shell 展开自身环境变量，口令不出现在宿主机命令行
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 有意不写 ports：3306 仅 compose 内部网络可达，公网不暴露

  backend:
    build:
      context: .
      dockerfile: Dockerfile        # 复用后端镜像；仅经 build arg 注入 PyPI 镜像，不改其生产逻辑
      args:
        # 服务器无法直连 files.pythonhosted.org（Fastly 限速/不可达，实测 40s 零字节），
        # 构建时注入腾讯云内网 PyPI 镜像；Dockerfile 默认仍为 pypi.org，本地/其他环境不受影响。
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
    restart: unless-stopped
    env_file: .env                  # JWT / LLM 等由服务器 .env 提供
    environment:
      # 覆盖 .env 中面向开发机的 DATABASE_URL，指向同网络 mysql 服务
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/ai_budget?charset=utf8mb4
      CHECKPOINT_DB_PATH: /app/backend/data/checkpoints.sqlite
      DB_ECHO: "false"              # 生产关闭 SQL echo（connection.py 阶段 3-3 开关）
    volumes:
      - ./data:/app/backend/data    # SQLite checkpoint 持久化（决策：V1.0 不迁 Redis/PG）
    depends_on:
      mysql:
        condition: service_healthy  # 等 MySQL 真正可连再启动，避免 create_all 竞态
    healthcheck:
      # python:3.13-slim 无 curl，用标准库 urllib 打 /health（阶段 3-3 新增端点，SELECT 1 验 DB）
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 有意不写 ports：仅 nginx 经内部网络反代 backend:8000

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile        # 多阶段：node 编译 dist → nginx:alpine 托管
      args:
        VITE_API_BASE_URL: /api     # build-time 烤入前端产物，同域反代
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"       # 服务器默认 80；本地验证可设 HTTP_PORT 避让占用
      # 阶段 3-7 签发证书后开放：
      # - "443:443"
    volumes:
      # certbot HTTP-01 挑战 webroot（阶段 3-7 启用；目录需在宿主机预先 mkdir）
      - ./nginx-certbot/www:/var/www/certbot
      # 阶段 3-7 证书签发后再挂载：
      # - ./nginx-certbot/conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:                       # named volume，随 compose 项目生命周期持久
