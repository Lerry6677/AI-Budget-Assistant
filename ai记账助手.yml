    - data:
        code: "import json\n\n\ndef is_empty(value):\n    \"\"\"判断变量是否为空。\"\"\"\n\
          \    if value is None:\n        return True\n\n    if isinstance(value,\
          \ str):\n        return not value.strip()\n\n    if isinstance(value, (dict,\
          \ list)):\n        return len(value) == 0\n\n    return False\n\n\ndef to_dict(value):\n\
          \    \"\"\"尽可能把结果转换成 dict，方便读取。\"\"\"\n    if isinstance(value, dict):\n\
          \        return value\n\n    if isinstance(value, str):\n        text =\
          \ value.strip()\n        if not text:\n            return {}\n\n       \
          \ try:\n            parsed = json.loads(text)\n            if isinstance(parsed,\
          \ dict):\n                return parsed\n        except Exception:\n   \
          \         pass\n\n    return {}\n\n\ndef result_to_text(value):\n    \"\"\
          \"把结果转换成适合展示给用户的文本。\"\"\"\n    if value is None:\n        return \"\"\n\n\
          \    if isinstance(value, str):\n        return value.strip()\n\n    if\
          \ isinstance(value, (dict, list)):\n        return json.dumps(value, ensure_ascii=False)\n\
          \n    return str(value)\n\n\ndef main(\n    intent,\n    record_result=None,\n\
          \    query_result=None,\n    chat_result=None,\n    mmr_result=None\n):\n\
          \    intent = (intent or \"\").strip().lower()\n\n    # =========================\n\
          \    # 1. 记账\n    # =========================\n    if intent == \"record\"\
          :\n        record = to_dict(record_result)\n\n        # 尝试判断成功状态\n     \
          \   success = record.get(\"success\")\n\n        if success is None:\n \
          \           status = str(record.get(\"status\", \"\")).lower()\n       \
          \     success = status in [\"success\", \"succeeded\", \"ok\"]\n\n     \
          \   # 明确失败\n        if success is False:\n            reason = (\n     \
          \           record.get(\"message\")\n                or record.get(\"error\"\
          )\n                or record.get(\"detail\")\n                or \"未知原因\"\
          \n            )\n\n            return {\n                \"result\": f\"\
          记账失败：{result_to_text(reason)}\"\n            }\n\n        # 明确成功\n     \
          \   if success is True:\n            detail = (\n                record.get(\"\
          message\")\n                or record.get(\"description\")\n           \
          \     or result_to_text(record_result)\n            )\n\n            return\
          \ {\n                \"result\": f\"已记录，{result_to_text(detail)}\"\n   \
          \         }\n\n        # 如果没有明确 success 字段，\n        # 但存在业务结果，则尽量按照结果返回\n\
          \        if not is_empty(record_result):\n            return {\n       \
          \         \"result\": f\"已记录，{result_to_text(record_result)}\"\n       \
          \     }\n\n        return {\n            \"result\": \"记账失败：没有获取到有效的记账结果。\"\
          \n        }\n\n    # =========================\n    # 2. 查询\n    # =========================\n\
          \    if intent == \"query\":\n        if is_empty(query_result):\n     \
          \       return {\n                \"result\": \"暂时没有获取到相关账单信息。\"\n     \
          \       }\n\n        return {\n            \"result\": result_to_text(query_result)\n\
          \        }\n\n    # =========================\n    # 3. 普通聊天\n    # =========================\n\
          \    if intent == \"chat\":\n        chat_text = result_to_text(chat_result)\n\
          \n        # 没有用户画像更新\n        if is_empty(mmr_result):\n            return\
          \ {\n                \"result\": chat_text\n            }\n\n        # 有用户画像更新\n\
          \        mmr_text = result_to_text(mmr_result)\n\n        return {\n   \
          \         \"result\": f\"{chat_text}\\n\\n另外，{mmr_text}\"\n        }\n\n\
          \    # =========================\n    # 4. 未知 intent\n    # =========================\n\
          \    return {\n        \"result\": \"\"\n    }\n"
        code_language: python3
